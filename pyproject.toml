[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replayryan"
version = "0.1.0.dev0"
description = "ReplayRyan Toolkit - one local-first view of Uoink, Zing, and Writer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rr = "replayryan.cli:main"
replayryan = "replayryan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
replayryan = ["web/*.css"]
