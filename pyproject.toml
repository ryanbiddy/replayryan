[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ryan-thrum"
version = "0.1.0.dev0"
description = "Read-only local status CLI for the Uoink, Zing, and Writer suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
suite = "thrum.cli:main"
thrum = "thrum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
